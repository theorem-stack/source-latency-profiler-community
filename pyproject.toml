[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-latency-profiler"
version = "0.1.0"
description = "Profile source and venue latency from local and cloud runner locations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
ws = ["websockets>=12.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
latency-profiler = "profiler.cli:main"

[tool.setuptools.packages.find]
include = ["profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
