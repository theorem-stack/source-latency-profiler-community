schema_version: 1

strategy:
  name: nullone_nfp_kalshi
  description: >
    Trade Kalshi NFP markets using BLS Employment Situation release data.
    Releases first Friday of each month at 8:30 AM ET.
    NullOne owns the multi-variable decision logic (payrolls + unemployment rate).
  mode: paper
  # event_id, event_time, release_at_et injected at runtime from calendars/kalshi-nfp-2026.json

event:
  source: bls_nfp
  # release_month injected at runtime via event_overrides
  metric: nonfarm_payrolls_change_k

markets:
  source: nullone_discover
  nullone:
    spec_template: "specs/kalshi_nfp_{discover_key}.yaml"
    series_ticker: KXNFP
    discover_key_field: release_month
    discover_command_template: "discover --event nfp --month {discover_key}"
  refresh:
    offsets:
      - "T-3d"
      - "T-1d"
      - "T-6h"
      - "T-30m"

execution:
  min_edge_after_fees: 0.05
  max_entry_price: 0.92
  release_capital_usd: 100
  execution_strategy: auto
  mode: paper

targets:
  sources:
    - name: bls_employment_release
      type: http
      url: https://www.bls.gov/news.release/empsit.nr0.htm
      expected_status: 200
      timeout_ms: 3000

    - name: bls_employment_api
      type: http
      url: https://api.bls.gov/publicAPI/v2/timeseries/data/CES0000000001
      expected_status: 200
      timeout_ms: 3000

  venues:
    - name: kalshi_status
      type: http
      url: https://external-api.kalshi.com/trade-api/v2/exchange/status
      expected_status: 200
      timeout_ms: 2000

    - name: kalshi_ws
      type: websocket
      url: wss://external-api-ws.kalshi.com/trade-api/ws/v2
      timeout_ms: 3000

candidate_locations:
  aws:
    regions:
      - us-east-1
      - us-east-2
      - us-west-2
    instance_types:
      - c7i.large
      - c7i.xlarge
      - m7i.large

objective:
  weights:
    source_ttfb_p50: 0.25
    source_ttfb_p95: 0.20
    venue_total_p50: 0.20
    venue_total_p95: 0.20
    jitter: 0.10
    failure_rate: 0.05
  minimum_samples: 100
  minimum_confidence: 0.85
  minimum_score_margin_pct: 15
  lookback: 10m

automation:
  allow_auto_deploy: true
  warmup_starts_at: "T-30m"
  profiler_stops_at: "T-2m"
  latest_deploy_cutoff: "T-3m"
  execution_starts_at: "T+0"
  fallback:
    mode: deploy_default_region
    provider: aws
    region: us-east-1

deployment:
  runtime: ec2
  engine: nullone
  require_public_ip: false
  placement: single_az_low_latency
  artifact:
    type: container
    image: "123456789012.dkr.ecr.us-east-1.amazonaws.com/nullone:wngsr-smoke-001"
    ecr:
      repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/nullone"
      tag_prefix: "nullone-runtime-"
      fallback_image: "123456789012.dkr.ecr.us-east-1.amazonaws.com/nullone:wngsr-smoke-001"
      cleanup:
        keep_last: 10
  startup_command: "nullone ready --config /etc/nullone/runtime.json"
  execution_command: "nullone execute --config /etc/nullone/runtime.json"
  secrets:
    source: aws_secrets_manager
    names:
      - nullone/prod/runtime/env
      - nullone/prod/kalshi/private_key_pem
